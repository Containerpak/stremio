name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 6 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-stremio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/containerpak/stremio
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Containerfile
          pull: true
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify package exports
        run: |
          docker pull ghcr.io/containerpak/stremio:main
          docker run --rm --entrypoint /bin/sh ghcr.io/containerpak/stremio:main -ec 'test -x /usr/local/bin/stremio-cpak && test -f /usr/share/applications/com.stremio.Stremio.desktop && test ! -e /usr/bin/stremio'

          source_url="$(jq -r '.runtime_sources[0].url' cpak.json)"
          source_sha="$(jq -r '.runtime_sources[0].sha256' cpak.json)"
          curl -fsSL "$source_url" -o stremio.deb
          printf '%s  %s\n' "$source_sha" stremio.deb | sha256sum -c -
          docker run --rm \
            -v "$PWD/stremio.deb:/tmp/stremio.deb:ro" \
            --entrypoint /bin/sh ghcr.io/containerpak/stremio:main -ec '
              dpkg-deb -x /tmp/stremio.deb /
              test -x /usr/bin/stremio
              test -x /usr/libexec/stremio/stremio
              ! ldd /usr/libexec/stremio/stremio | grep -q "not found"
              XDG_RUNTIME_DIR=/tmp timeout 5s /usr/local/bin/stremio-cpak >/tmp/stremio.log 2>&1 || true
              grep -aFq com.stremio.Stremio /tmp/stremio-schemas/gschemas.compiled
              ! grep -Fq "Settings schema" /tmp/stremio.log
            '

      - name: Publish summary
        run: echo "ghcr.io/containerpak/stremio@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Pin published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repository="$(jq -r '.image | split("@")[0]' cpak.json)"
          jq --arg image "${repository}@${IMAGE_DIGEST}" '.image = $image' cpak.json > cpak.json.next
          mv cpak.json.next cpak.json
          if ! git diff --quiet -- cpak.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cpak.json
            git commit -m "chore: pin published image [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62

      - name: Install cpak-sign
        run: |
          curl -fsSLO https://github.com/Containerpak/cpak/releases/download/v2.10.16/cpak-sign-linux-amd64
          echo '3f0feeb0c2428de8205ea0380635d9e334bdbd46ff6917647cf1e8f16265e424  cpak-sign-linux-amd64' | sha256sum -c -
          install -Dm755 cpak-sign-linux-amd64 /usr/local/bin/cpak-sign

      - name: Sign the package state
        env:
          CPAK_REGISTRY_USERNAME: ${{ github.actor }}
          CPAK_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          cpak-sign state \
            --origin "github.com/${repository}" \
            --generation "${{ github.run_number }}"
          cosign sign-blob --yes --new-bundle-format=true \
            --bundle cpak-state.sigstore.json cpak-state
          cpak-sign attach --image "ghcr.io/${repository}"